{% extends "hello/layout.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post" action="">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Login</button>
</form>
{% if next %}
    <input type="hidden" name="next" value="{{ next }}" />
{% endif %}
{% if form.errors %}
    <p style="color: red;">Invalid username or password.</p>
{% endif %}
{% endblock %}
