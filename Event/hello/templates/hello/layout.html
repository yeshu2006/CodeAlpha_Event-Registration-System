<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>{% block title %}{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'hello/site.css' %}"/>
</head>

<body>
<div class="navbar">
    <a href="{% url 'home' %}" class="navbar-brand">Home</a>
    <a href="{% url 'event_list' %}" class="navbar-item">Events</a>
    <a href="{% url 'my_registrations' %}" class="navbar-item">My Registrations</a>
    <!-- <a href="#" class="navbar-item">New Message</a> -->
    <!-- <a href="#" class="navbar-item">About</a> -->
    {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}?next={% url 'home' %}" style="display:inline;">
            {% csrf_token %}
            <button type="submit" class="navbar-item" style="background:none;border:none;padding:0;cursor:pointer;">Logout</button>
        </form>
    {% else %}
        <a href="{% url 'login' %}?next={% url 'home' %}" class="navbar-item">Login</a>
        <a href="{% url 'signup' %}" class="navbar-item">Sign up</a>
    {% endif %}
</div>

<div class="body-content">
    {% block content %}
    {% endblock %}
    <hr/>
</div>
</body>
</html>
